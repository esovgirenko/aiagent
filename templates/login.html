<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} — Login</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>{{ title }}</h1>
      <p class="subtitle">Вход в интерфейс агента</p>
      <form method="post" action="/login" class="chat-form">
        <input type="text" name="username" placeholder="Логин" value="admin" required />
        <input type="password" name="password" placeholder="Пароль" required />
        <button type="submit">Войти</button>
      </form>
      {% if error %}
      <p>Неверный логин или пароль.</p>
      {% endif %}
      <p>Если не задан `DEFAULT_PASSWORD`, авторизация отключена.</p>
    </main>
  </body>
  </html>
